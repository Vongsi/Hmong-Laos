; On top of PHP's production settings (deploy/Dockerfile).

; Phone photos: members can pick several at once.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 60

expose_php = Off

; The code only changes with a new image, but Laravel's compiled views (in storage) change between deploys.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
