<!doctype html>
<!-- The link preview image (public/images/og-default.png, 1200×630) for pages without a photo of their own.
     Rendered with a headless browser from this file; see resources/brand/README.md. -->
<html lang="hmn">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=Figtree:wght@400&display=swap">
<style>
html,body{margin:0}
.card{width:1200px;height:630px;background:#1E2656;position:relative;overflow:hidden;display:flex;align-items:center;gap:64px;padding:0 80px;box-sizing:border-box}
.band{position:absolute;left:0;right:0;height:28px;background:
  linear-gradient(135deg,#B8263F 25%,transparent 25%) -14px 0/28px 28px,
  linear-gradient(225deg,#B8263F 25%,transparent 25%) -14px 0/28px 28px,
  linear-gradient(315deg,#2E7A58 25%,transparent 25%) 0 0/28px 28px,
  linear-gradient(45deg,#2E7A58 25%,#1E2656 25%) 0 0/28px 28px}
.top{top:0}.bottom{bottom:0}
.mark{width:250px;height:250px;flex:none}
.name{font-family:Alegreya,Georgia,serif;font-weight:800;font-size:100px;line-height:1;color:#fff;margin:0}
.meaning{font-family:Alegreya,Georgia,serif;font-weight:700;font-size:46px;line-height:1.2;color:#C9CEF4;margin:14px 0 0}
.about{font-family:Figtree,system-ui,sans-serif;font-size:28px;color:#C9CEF4;margin:34px 0 0}
</style>
</head>
<body>
<div class="card">
  <div class="band top"></div>
  <img class="mark" src="symbol-on-dark.svg" alt="">
  <div>
    <p class="name">Daim Av Hlub</p>
    <p class="meaning">The Land of Love</p>
    <p class="about">News, events and culture of Hmong across Laos</p>
  </div>
  <div class="band bottom"></div>
</div>
</body>
</html>
