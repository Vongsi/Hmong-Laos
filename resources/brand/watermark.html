<!doctype html>
<!-- The watermark on the site's photos → public/images/watermark.png (screenshot of #mark, transparent background).
     White on a see-through dark pill, so it reads on white backgrounds as well as on busy or dark photos; Glide sizes and places it (App\Support\Watermark). -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@800&display=swap">
<style>
html,body{margin:0;background:transparent}
#mark{display:inline-flex;align-items:center;gap:30px;padding:26px 56px 26px 34px;background:rgba(12,14,34,.42);border-radius:999px}
#mark svg{width:168px;height:168px;flex:none;filter:drop-shadow(0 2px 6px rgba(8,10,30,.4))}
#mark span{font-family:Alegreya,Georgia,serif;font-weight:800;font-size:124px;line-height:1;color:#fff;white-space:nowrap;
  text-shadow:0 2px 8px rgba(8,10,30,.4)}
</style>
</head>
<body>
<div id="mark">
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <path fill="#FFFFFF" fill-rule="evenodd" d="M50 5 L95 50 L50 95 L5 50 Z M50 17 L83 50 L50 83 L17 50 Z"/>
    <path fill="#EE6A80" d="M50 23 L58 31 L50 39 L42 31 Z M69 42 L77 50 L69 58 L61 50 Z M50 61 L58 69 L50 77 L42 69 Z M31 42 L39 50 L31 58 L23 50 Z"/>
    <path fill="#5CC596" d="M50 43.5 L56.5 50 L50 56.5 L43.5 50 Z"/>
  </svg>
  <span>Daim Av Hlub</span>
</div>
</body>
</html>
