title: User
fields:
  -
    handle: name
    field:
      type: text
      display: Name
  -
    handle: email
    field:
      type: text
      input: email
      display: Email Address
  -
    handle: roles
    field:
      type: user_roles
      width: 50
  -
    handle: groups
    field:
      type: user_groups
      width: 50
  -
    handle: avatar
    field:
      type: assets
      max_files: 1
      container: assets
  -
    handle: phone
    field:
      type: text
      display: 'Mobile number (WhatsApp)'
      instructions: 'From My account. Only the team sees it; checkout fills it in for the member.'
      width: 50
  -
    handle: payout_bank
    field:
      type: text
      display: 'Payout bank'
      instructions: 'Where we send a seller''s money (Seller payouts). From My account.'
      width: 33
  -
    handle: payout_account_name
    field:
      type: text
      display: 'Payout account name'
      width: 33
  -
    handle: payout_account_number
    field:
      type: text
      display: 'Payout account number'
      width: 33
  -
    handle: province
    field:
      type: text
      display: Province
      width: 50
  -
    handle: clan
    field:
      type: text
      display: 'Clan (xeem)'
      width: 50
  -
    handle: area
    field:
      type: text
      display: 'District or village'
      width: 50
  -
    handle: show_in_directory
    field:
      type: toggle
      display: 'Listed on the Members page'
      instructions: 'Members turn this on themselves on the Members page.'
      width: 50
  -
    handle: last_seen_at
    field:
      type: date
      display: 'Last seen'
      time_enabled: true
      visibility: read_only
      listable: true
      width: 50
  -
    handle: preferred_lang
    field:
      type: select
      display: 'Site language'
      width: 50
      options:
        hm: Hmoob
        lo: ລາວ
        en: English
