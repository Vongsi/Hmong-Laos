title: User
fields:
  -
    handle: name
    field:
      type: text
      display: Name
  -
    handle: email
    field:
      type: text
      input: email
      display: Email Address
  -
    handle: roles
    field:
      type: user_roles
      width: 50
  -
    handle: groups
    field:
      type: user_groups
      width: 50
  -
    handle: avatar
    field:
      type: assets
      max_files: 1
      container: assets
      instructions: 'Their profile photo: members add, crop and remove it on My account (kept in avatars/). Shown on the Members page.'
  -
    handle: phone
    field:
      type: text
      display: 'Mobile number (WhatsApp)'
      instructions: 'From My account. Only the team sees it; checkout fills it in for the member.'
      width: 50
  -
    handle: whatsapp
    field:
      type: text
      display: 'WhatsApp sign-in number'
      instructions: 'The number this member signs in with (a code sent there), with the country code, digits only: 8562055551234. For someone who changed phones, put their new number here. Empty: no WhatsApp sign-in.'
      width: 50
      validate:
        - nullable
        - 'regex:/^[1-9][0-9]{7,14}$/'
        - 'unique_user_value:{id}'
  -
    handle: whatsapp_verified_at
    field:
      type: date
      display: 'WhatsApp number confirmed'
      instructions: 'When the member last confirmed it with a code.'
      time_enabled: true
      visibility: read_only
      width: 50
  -
    handle: payout_bank
    field:
      type: text
      display: 'Payout bank'
      instructions: 'Where we send a seller''s money (Seller payouts). From My account.'
      width: 33
  -
    handle: payout_account_name
    field:
      type: text
      display: 'Payout account name'
      width: 33
  -
    handle: payout_account_number
    field:
      type: text
      display: 'Payout account number'
      width: 33
  -
    handle: country
    field:
      type: dictionary
      dictionary:
        type: countries
        emojis: false
      max_items: 1
      display: Country
      instructions: 'From My account. Members in Laos also choose a province.'
      width: 50
  -
    handle: province
    field:
      type: text
      display: Province
      instructions: 'In Laos only.'
      width: 50
  -
    handle: clan
    field:
      type: text
      display: 'Clan (xeem)'
      width: 50
  -
    handle: area
    field:
      type: text
      display: 'District or village'
      width: 50
  -
    handle: show_in_directory
    field:
      type: toggle
      display: 'Listed on the Members page'
      instructions: 'On when they join (signed-in members see their name, photo, province or country and when they''re online); members can turn it off on the Members page or My account.'
      width: 50
  -
    handle: last_seen_at
    field:
      type: date
      display: 'Last seen'
      time_enabled: true
      visibility: read_only
      listable: true
      width: 50
  -
    handle: preferred_lang
    field:
      type: select
      display: 'Site language'
      width: 50
      options:
        hm: Hmoob
        lo: ລາວ
        en: English
