title: Interview
tabs:
  main:
    display: Main
    sections:
    - fields:
      - handle: title
        field:
          type: text
          display: Title
          required: true
          localizable: true
      - handle: person_name
        field:
          type: text
          display: Person
          required: true
          localizable: true
      - handle: person_role
        field:
          type: text
          display: Role and place
          placeholder: Doctor, Vientiane
          localizable: true
      - handle: portrait
        field:
          type: assets
          display: Portrait
          container: assets
          max_files: 1
          localizable: true
      - handle: intro
        field:
          type: textarea
          display: Intro
          localizable: true
      - handle: video_url
        field:
          type: video
          display: Video
          localizable: true
      - handle: qa
        field:
          type: replicator
          display: Interview
          localizable: true
          sets:
            main:
              display: Blocks
              sets:
                question_answer:
                  display: Question and answer
                  fields:
                  - handle: question
                    field:
                      type: text
                      display: Question
                  - handle: answer
                    field:
                      type: textarea
                      display: Answer
                pull_quote:
                  display: Highlighted quote
                  fields:
                  - handle: quote
                    field:
                      type: textarea
                      display: Quote
                photo:
                  display: Photo
                  fields:
                  - handle: photo
                    field:
                      type: assets
                      display: Photo
                      container: assets
                      max_files: 1
                  - handle: caption
                    field:
                      type: text
                      display: Caption
  sidebar:
    display: Sidebar
    sections:
    - display: From a member
      instructions: Sent by a member through "Share". Check the text and photo (translate them if needed), then switch Published on and save. To ask for changes instead, write a message to the member and save while it is still a draft.
      fields:
      - handle: submitted_by
        field:
          type: users
          display: Sent by (account)
          max_items: 1
          visibility: hidden
          localizable: false
      - handle: submitted_by_name
        field:
          type: text
          display: Sent by
          visibility: read_only
          listable: true
          localizable: false
          if:
            submitted_by: not empty
      - handle: review_note
        field:
          type: textarea
          display: Message to the member
          instructions: What to change. The member gets an email and sees it on their Share page. They update it and send it again.
          localizable: false
          if:
            submitted_by: not empty
    - fields:
      - handle: date
        field:
          type: date
          display: Date
          required: true
          default: now
      - handle: slug
        field:
          type: slug
          display: Slug
          localizable: true
          validate: max:200
      - handle: topics
        field:
          type: terms
          display: Topic
          taxonomies:
          - topics
          create: false
          max_items: 1
          mode: select
          localizable: true
      - handle: provinces
        field:
          type: terms
          display: Province
          taxonomies:
          - provinces
          create: false
          max_items: 1
          mode: select
          localizable: true
      - handle: featured
        field:
          type: toggle
          display: Feature on Inspire page
          localizable: true
    - display: Facebook
      fields:
      - handle: facebook_share
        field:
          type: toggle
          display: Also post to our Facebook Page
          instructions: Posts a link to this page on our Facebook Page
            once it is published, one time only. Each language is posted separately.
          localizable: true
          default: false
      - handle: push_notify
        field:
          type: toggle
          display: Send a phone notification
          instructions: Sends a notification to members who turned on notifications
            and use this language, once it is published, one time only.
          localizable: true
          default: false
