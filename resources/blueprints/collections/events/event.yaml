title: Event
tabs:
  main:
    display: Main
    sections:
    - fields:
      - handle: title
        field:
          type: text
          display: Title
          required: true
          localizable: true
      - handle: cover
        field:
          type: assets
          display: Cover photo
          container: assets
          max_files: 1
          localizable: true
      - handle: summary
        field:
          type: textarea
          display: Summary
          localizable: true
      - handle: content
        field:
          type: bard
          display: Content
          localizable: true
          buttons:
          - h2
          - h3
          - bold
          - italic
          - unorderedlist
          - orderedlist
          - quote
          - link
          - image
          container: assets
          save_html: false
      - handle: schedule
        field:
          type: grid
          display: Schedule
          localizable: true
          add_row: Add item
          fields:
          - handle: when
            field:
              type: text
              display: When (e.g. Day 1, 09:00)
          - handle: what
            field:
              type: text
              display: What happens
  sidebar:
    display: Sidebar
    sections:
    - display: From a member
      instructions: Sent by a member through "Share". Check the text and photo (translate them if needed), then switch Published on and save. To ask for changes instead, write a message to the member and save while it is still a draft.
      fields:
      - handle: submitted_by
        field:
          type: users
          display: Sent by (account)
          max_items: 1
          visibility: hidden
          localizable: false
      - handle: submitted_by_name
        field:
          type: text
          display: Sent by
          visibility: read_only
          listable: true
          localizable: false
          if:
            submitted_by: not empty
      - handle: review_note
        field:
          type: textarea
          display: Message to the member
          instructions: What to change. The member gets an email and sees it on their Share page. They update it and send it again.
          localizable: false
          if:
            submitted_by: not empty
    - fields:
      - handle: slug
        field:
          type: slug
          display: Slug
          localizable: true
          validate: max:200
      - handle: start_date
        field:
          type: date
          display: Starts
          required: true
          time_enabled: true
          localizable: true
      - handle: end_date
        field:
          type: date
          display: Ends
          time_enabled: true
          localizable: true
      - handle: venue
        field:
          type: text
          display: Venue
          localizable: true
      - handle: provinces
        field:
          type: terms
          display: Province
          taxonomies:
          - provinces
          create: false
          max_items: 1
          mode: select
          localizable: true
      - handle: map_url
        field:
          type: text
          display: Map link
          input_type: url
          localizable: true
      - handle: contact_phone
        field:
          type: text
          display: Contact phone
          localizable: true
      - handle: entry_fee
        field:
          type: text
          display: Entry fee
          placeholder: Free
          localizable: true
      - handle: rsvp_enabled
        field:
          type: toggle
          display: Allow RSVP
          default: true
          localizable: true
      - handle: volunteers_needed
        field:
          type: toggle
          display: Ask for volunteers
          localizable: true
    - display: Facebook
      fields:
      - handle: facebook_share
        field:
          type: toggle
          display: Also post to our Facebook Page
          instructions: Posts a link to this page on our Facebook Page
            once it is published, one time only. Each language is posted separately.
          localizable: true
          default: false
      - handle: push_notify
        field:
          type: toggle
          display: Send a phone notification
          instructions: Sends a notification to members who turned on notifications
            and use this language, once it is published, one time only.
          localizable: true
          default: false
