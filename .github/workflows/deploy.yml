# After every push to main: check the code, then put the new version live on the VPS by running
# deploy/deploy.sh there over SSH. Setup: deploy/README.md → Automatic deploys.
# A commit message with [skip ci] pushes without deploying.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Code style (the site's own code)
        run: vendor/bin/pint --test app routes lang
      - name: PHP syntax
        run: find app config database lang routes -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on the VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes "$SSH_USER@$SSH_HOST" bash /opt/dah/app/deploy/deploy.sh
